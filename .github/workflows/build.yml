on:
  push:
    branches: [master]
  workflow_dispatch:
env:
  SIGNED_BY: UniversalRepository
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: void
            arch: x86_64
            repo: builddir/void/hostdir/binpkgs
            key: UREPO_KEY_RSA
            metadata: "*-repodata"
          - distro: arch
            arch: x86_64
            repo: builddir/arch/x86_64
            key: UREPO_GPG_KEY
            metadata: "universalrepository.db* universalrepository.files*"
          - distro: chimera
            arch: x86_64
            repo: builddir/chimera/packages
            key: UREPO_KEY_RSA
            metadata: "Packages.adb APKINDEX.tar.gz"
    container:
      image: ghcr.io/universalrepository/builder:latest
      options: --privileged --user 0
    defaults:
      run:
        shell: bash
    env:
      DISTRO: ${{ matrix.distro }}
      ARCH: ${{ matrix.arch }}
      REPO_DIR: ${{ matrix.repo }}
      SIGN_KEY: /tmp/urepo-signing/key
      SF_USER: ${{ vars.UREPO_SOURCEFORGE_USER }}
      SF_BASE: ${{ vars.UREPO_SOURCEFORGE_PATH }}
      METADATA: ${{ matrix.metadata }}
    steps:
      - name: Pull repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare workspace
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Setup upload target
        env:
          SSH_KEY: ${{ secrets.UREPO_SOURCEFORGE_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.UREPO_SOURCEFORGE_KNOWN_HOSTS }}
        run: |
          set -eu
          : "${SF_USER:?missing SourceForge username}"
          : "${SF_BASE:?missing SourceForge directory}"
          : "${SSH_KEY:?missing SourceForge SSH key}"
          : "${KNOWN_HOSTS:?missing SourceForge host keys}"
          umask 077
          mkdir -p /root/.ssh
          printf '%s\n' "$SSH_KEY" > /root/.ssh/urepo
          printf '%s\n' "$KNOWN_HOSTS" > /root/.ssh/known_hosts
          cat > /root/.ssh/config <<'SSH'
          Host frs.sourceforge.net
              IdentityFile /root/.ssh/urepo
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
          SSH

      - name: Pull existing packages
        run: |
          set -eu
          mkdir -p "$REPO_DIR"
          rsync -rtL "$SF_USER@frs.sourceforge.net:${SF_BASE%/}/$DISTRO/" "$REPO_DIR/"
          chown -R builder:builder builddir

      - name: Find packages to build
        run: |
          set -euo pipefail
          runuser -u builder -- env UREPO_VOID_XBPS_ARGS="${EXTRA_ARGS:-}" \
            ./.ci/unbuilt.sh "$DISTRO" > .list.pending
          mv .list.pending .list
          cat .list

      - name: Check build environment
        run: |
          set -eu
          [ -s .list ] || exit 0

          sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          
          case "$DISTRO" in
            void)
              checkdir=$(mktemp -d)
              trap 'rm -rf "$checkdir"' EXIT
              mkdir -p "$checkdir"/{proc,sys,dev}
              install -m 755 "$(command -v xbps-uhelper)" "$checkdir/xbps-uhelper"
              chown builder:builder "$checkdir"
              runuser -u builder -- xbps-uchroot "$checkdir" /xbps-uhelper -V
              ;;
            arch)
              runuser -u builder -- sudo -n unshare --mount --propagation private /bin/true
              ;;
          esac

      - name: Setup signing key
        env:
          KEY: ${{ secrets[matrix.key] }}
        run: |
          set -eu
          [ -s .list ] || exit 0
          : "${KEY:?missing signing key}"
          umask 077
          install -d -m 700 -o builder -g builder "${SIGN_KEY%/*}"
          printf '%s' "$KEY" | base64 -d > "$SIGN_KEY"
          chown builder:builder "$SIGN_KEY"

      - name: Build packages
        run: |
          set -euo pipefail
          [ -s .list ] || exit 0
          runuser -u builder -- env \
            UREPO_VOID_SIGN_KEY="$SIGN_KEY" \
            UREPO_GPG_SIGN_KEY="$SIGN_KEY" \
            UREPO_VOID_SIGNED_BY="$SIGNED_BY" \
            UREPO_VOID_XBPS_ARGS="${EXTRA_ARGS:-}" \
            XBPS_ARCH="$ARCH" XBPS_TARGET_ARCH="$ARCH" \
            UREPO_ARCH_ARCH="$ARCH" \
            bash -euo pipefail -c '
              cd "$1"
              mapfile -t packages < .list
              ./urepo build "${packages[@]}"
            ' bash "$GITHUB_WORKSPACE" 2>&1 | tee build.log

      - name: Upload built packages
        run: |
          set -euo pipefail
          [ -s .list ] || exit 0
          read -r -a patterns <<< "$METADATA"
          filters=()
          for pattern in "${patterns[@]}"; do
            filters+=("--exclude=$pattern")
          done
          rsync -rtLv "${filters[@]}" "$REPO_DIR/" "$SF_USER@frs.sourceforge.net:${SF_BASE%/}/$DISTRO/"

      - name: Upload metadata
        run: |
          set -euo pipefail
          [ -s .list ] || exit 0
          read -r -a patterns <<< "$METADATA"
          filters=(--include='*/')
          for pattern in "${patterns[@]}"; do
            filters+=("--include=$pattern")
          done
          rsync -rtLv "${filters[@]}" --exclude='*' "$REPO_DIR/" "$SF_USER@frs.sourceforge.net:${SF_BASE%/}/$DISTRO/"

      - name: Verify uploaded repository
        run: |
          set -eu
          [ -s .list ] || exit 0
          rsync -rcnL --out-format='%n' \
            "$REPO_DIR/" "$SF_USER@frs.sourceforge.net:${SF_BASE%/}/$DISTRO/" \
            > .upload-check
          if [ -s .upload-check ]; then
            printf '%s\n' 'error: uploaded repository differs from local files'
            cat .upload-check
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.distro }}-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove keys
        if: always()
        run: |
          rm -rf "${SIGN_KEY%/*}" "builddir/$DISTRO/gpg"
          rm -f /root/.ssh/urepo

  index:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/universalrepository/builder:latest
      options: --user 0
    defaults:
      run:
        shell: bash
    env:
      SF_USER: ${{ vars.UREPO_SOURCEFORGE_USER }}
      SF_BASE: ${{ vars.UREPO_SOURCEFORGE_PATH }}
    steps:
      - name: Pull repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup upload target
        env:
          SSH_KEY: ${{ secrets.UREPO_SOURCEFORGE_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.UREPO_SOURCEFORGE_KNOWN_HOSTS }}
        run: |
          set -eu
          : "${SF_USER:?missing SourceForge username}"
          : "${SF_BASE:?missing SourceForge directory}"
          : "${SSH_KEY:?missing SourceForge SSH key}"
          : "${KNOWN_HOSTS:?missing SourceForge host keys}"
          umask 077
          mkdir -p /root/.ssh
          printf '%s\n' "$SSH_KEY" > /root/.ssh/urepo
          printf '%s\n' "$KNOWN_HOSTS" > /root/.ssh/known_hosts
          cat > /root/.ssh/config <<'SSH'
          Host frs.sourceforge.net
              IdentityFile /root/.ssh/urepo
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
          SSH

      - name: Pull published metadata
        run: |
          set -euo pipefail
          python3 .ci/index.py --patterns > .index-patterns
          filters=(--include='*/')
          while IFS= read -r pattern; do
            filters+=("--include=$pattern")
          done < .index-patterns
          mkdir -p published
          rsync -rtL "${filters[@]}" --exclude='*' \
            "$SF_USER@frs.sourceforge.net:${SF_BASE%/}/" published/

      - name: Generate package index
        run: python3 .ci/index.py --root published --output packages.json

      - name: Upload package index
        run: |
          set -eu
          rsync -rtv --chmod=F644 packages.json "$SF_USER@frs.sourceforge.net:${SF_BASE%/}/packages.json"

      - name: Remove keys
        if: always()
        run: rm -f /root/.ssh/urepo
