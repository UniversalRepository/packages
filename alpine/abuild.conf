PACKAGER='UniversalRepository'
PACKAGER_PRIVKEY=/tmp/urepo-signing/universalrepository.rsa
PACKAGER_PUBKEY=$ABUILD_USERDIR/universalrepository.rsa.pub
REPODEST=/build/packages
SRCDEST=/build/sources
APORTSDIR=/build/aports
ABUILD_V3_INDEX=

urepo_metadata() {
    local sub
    check_arch || return 0
    for sub in $allpackages; do
        subpkg_set "$sub"
        printf '%s %s-r%s %s\n' "$subpkgname" "$pkgver" "$pkgrel" "$(arch2dir "$subpkgarch")"
    done
    subpkg_unset
}

urepo_dependencies() {
    local dependency
    calcdeps
    for dependency in $builddeps $hostdeps; do
        printf '%s\n' "$dependency"
    done
}
